services:
  # PostgreSQL Datenbank
  postgres:
    image: postgres:16-alpine
    container_name: gradify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradify
      POSTGRES_PASSWORD: gradify123
      POSTGRES_DB: gradify_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradify"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gradify-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: gradify
      RABBITMQ_DEFAULT_PASS: gradify123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: ./gradify-api-gateway
      dockerfile: Dockerfile
    container_name: gradify-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      studiengang-service:
        condition: service_started
      noten-service:
        condition: service_started
      berechnungs-service:
        condition: service_started

  # Auth Service
  auth-service:
    build:
      context: ./gradify-auth-service
      dockerfile: Dockerfile
    container_name: gradify-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gradify_auth
      GRPC_CLIENT_USER_SERVICE_ADDRESS: static://user-service:9082
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  # User Service
  user-service:
    build:
      context: ./gradify-user-service
      dockerfile: Dockerfile
    container_name: gradify-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gradify_user
    depends_on:
      postgres:
        condition: service_healthy

  # Studiengang Service
  studiengang-service:
    build:
      context: ./gradify-studiengang-service
      dockerfile: Dockerfile
    container_name: gradify-studiengang-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gradify_studiengang
      GRADIFY_TENANT_REGISTRY_URL: jdbc:postgresql://postgres:5432/gradify_auth
      GRPC_CLIENT_USER_SERVICE_ADDRESS: static://user-service:9082
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  # Noten Service
  noten-service:
    build:
      context: ./gradify-noten-service
      dockerfile: Dockerfile
    container_name: gradify-noten-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gradify_noten
      GRADIFY_TENANT_REGISTRY_URL: jdbc:postgresql://postgres:5432/gradify_auth
      SPRING_RABBITMQ_HOST: rabbitmq
      GRPC_CLIENT_BERECHNUNGS_SERVICE_ADDRESS: static://berechnungs-service:9085
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Berechnungs Service
  berechnungs-service:
    build:
      context: ./gradify-berechnungs-service
      dockerfile: Dockerfile
    container_name: gradify-berechnungs-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gradify_berechnung
      GRADIFY_TENANT_REGISTRY_URL: jdbc:postgresql://postgres:5432/gradify_auth
      SPRING_RABBITMQ_HOST: rabbitmq
      GRPC_CLIENT_NOTEN_SERVICE_ADDRESS: static://noten-service:9084
      GRPC_CLIENT_STUDIENGANG_SERVICE_ADDRESS: static://studiengang-service:9083
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      noten-service:
        condition: service_started
      studiengang-service:
        condition: service_started

  # Frontend (Angular PWA mit nginx)
  frontend:
    build:
      context: ./gradify-frontend
      dockerfile: Dockerfile
    container_name: gradify-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

  # pgAdmin (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gradify-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gradify.de
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  rabbitmq_data:
  pgadmin_data:
