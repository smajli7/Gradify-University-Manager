services:
  # PostgreSQL Datenbank für alle Services
  postgres:
    image: postgres:16-alpine
    container_name: gradify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradify
      POSTGRES_PASSWORD: gradify123
      POSTGRES_DB: gradify_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradify"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gradify-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: gradify
      RABBITMQ_DEFAULT_PASS: gradify123
    ports:
      - "5672:5672"    # AMQP Protocol
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin für Datenbank-Management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gradify-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gradify.de
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  rabbitmq_data:

