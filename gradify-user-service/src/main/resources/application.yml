server:
  port: 8082

spring:
  application:
    name: gradify-user-service
  profiles:
    active: dev
  
  # Datenbank Konfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/gradify_user
    username: gradify
    password: gradify123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # GraphQL
  graphql:
    graphiql:
      enabled: true
    path: /graphql
    schema:
      printer:
        enabled: true

  # File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# gRPC Server
grpc:
  server:
    port: 9082

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# JWT (gleicher Secret wie Auth-Service fuer Signatur-Verifikation)
jwt:
  secret: gradify-secret-key-change-in-production-min-256-bit

# Logging
logging:
  level:
    de.gradify: DEBUG

# Shared User DB: Alle Benutzer in einer Datenbank (mandant_id für Filterung)
# Nur Studiengang/Noten/Berechnung nutzen DB-per-Tenant
gradify:
  tenant-routing:
    enabled: false
  tenant-registry:
    enabled: false
  tenants: "1:thm,2:gu"  # Für gRPC-Aufrufer (Studiengang/Noten) – Mandant-Mapping

---
# Profil für Entwicklung (lokale Datenbank mit Seed-Daten)
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8

---
# Profil für Produktion (Supabase)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate


