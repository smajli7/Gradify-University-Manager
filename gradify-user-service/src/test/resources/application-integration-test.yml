# Integration-Test Konfiguration fuer User-Service (Testcontainers Postgres)
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  graphql:
    schema:
      inspection:
        enabled: false

# JWT Secret (gleich wie Auth-Service Tests)
jwt:
  secret: test-secret-key-for-integration-tests-only-1234567890

# Security
security:
  jwt:
    secret: test-secret-key-for-integration-tests-only-1234567890

# gRPC deaktiviert fuer Integration Tests
grpc:
  server:
    port: -1
  client:
    GLOBAL:
      negotiation-type: plaintext

# Tenant-Routing/Provisioning in Integration-Tests deaktivieren:
# Integration-Tests laufen gegen EIN Testcontainers-Postgres-DB (kein DB-per-Tenant).
gradify:
  tenant-provisioning:
    enabled: false
  tenant-routing:
    enabled: false
  tenant-registry:
    enabled: false
