syntax = "proto3";

option java_multiple_files = true;
option java_package = "de.gradify.shared.grpc.berechnung";
option java_outer_classname = "BerechnungProto";

package berechnung;

// Service für Notenberechnung (Noten -> Berechnung)
service BerechnungsService {
  // Triggert Neuberechnung der Gesamtnote
  rpc TriggerNeuberechnung(NeuberechnungRequest) returns (NeuberechnungResponse);
  
  // Holt berechnete Gesamtnote
  rpc GetGesamtnote(GesamtnoteRequest) returns (GesamtnoteResponse);
}

// Service für Noten-Abruf (Berechnung -> Noten)
service NotenDataService {
  // Holt alle Noten einer Einschreibung für Berechnung
  rpc GetNotenFuerBerechnung(NotenRequest) returns (NotenListResponse);
}

// Service für Regelwerk (Berechnung -> Studiengang)
service RegelwerkService {
  // Holt PO-Regelwerk für Berechnung
  rpc GetRegelwerk(RegelwerkRequest) returns (RegelwerkResponse);
  
  // Holt Modul-Gewichtungen
  rpc GetModulGewichtungen(ModulGewichtungRequest) returns (ModulGewichtungListResponse);
  
  // Holt Einschreibungsdetails (PO-ID, ECTS) für Berechnung
  rpc GetEinschreibungDetails(EinschreibungDetailsRequest) returns (EinschreibungDetailsResponse);
}

// Messages

message NeuberechnungRequest {
  int64 einschreibung_id = 1;
}

message NeuberechnungResponse {
  bool success = 1;
  double gesamtnote = 2;
  string status = 3;
  string message = 4;
}

message GesamtnoteRequest {
  int64 einschreibung_id = 1;
}

message GesamtnoteResponse {
  int64 einschreibung_id = 1;
  double gesamtnote = 2;
  double gesamtnote_roh = 3;
  string status = 4;
  string berechnet_am = 5;
  int32 module_bestanden = 6;
  int32 module_gesamt = 7;
}

message NotenRequest {
  int64 einschreibung_id = 1;
}

message NoteData {
  int64 modul_id = 1;
  double note_wert = 2;
  double gewichtung = 3;
  bool in_gesamtnote = 4;
  bool bestanden = 5;
}

message NotenListResponse {
  repeated NoteData noten = 1;
}

message RegelwerkRequest {
  int64 po_id = 1;
}

message RegelwerkResponse {
  int64 po_id = 1;
  string berechnungsart = 2;
  string formel = 3;
  string parameter_json = 4;
}

message ModulGewichtungRequest {
  int64 po_id = 1;
}

message ModulGewichtung {
  int64 modul_id = 1;
  string modul_nr = 2;
  double gewichtung = 3;
  bool in_gesamtnote = 4;
  int32 ects = 5;
  string modul_name = 6;
}

message ModulGewichtungListResponse {
  repeated ModulGewichtung module = 1;
}

// Einschreibungsdetails für Berechnung
message EinschreibungDetailsRequest {
  int64 einschreibung_id = 1;
}

message EinschreibungDetailsResponse {
  int64 einschreibung_id = 1;
  int64 po_id = 2;
  int32 ects_gesamt = 3;
  string studiengang_name = 4;
  bool found = 5;
}
