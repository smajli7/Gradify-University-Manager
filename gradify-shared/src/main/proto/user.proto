syntax = "proto3";

option java_multiple_files = true;
option java_package = "de.gradify.shared.grpc.user";
option java_outer_classname = "UserProto";

package user;

// Service für User-Validierung (Auth -> User)
service UserValidationService {
  // Prüft Zugangsdaten bei Login
  rpc ValidateCredentials(CredentialsRequest) returns (CredentialsResponse);
  
  // Holt Benutzer anhand ID
  rpc GetUserById(UserIdRequest) returns (UserResponse);
  
  // Holt Benutzer anhand Benutzername
  rpc GetUserByUsername(UsernameRequest) returns (UserResponse);
}

// Service für Studentendaten (Studiengang -> User)
service StudentDataService {
  // Prüft ob Student existiert
  rpc StudentExists(StudentIdRequest) returns (StudentExistsResponse);
  
  // Holt Student anhand ID
  rpc GetStudent(StudentIdRequest) returns (StudentResponse);
  
  // Holt alle Studenten eines Studiengangs (via Studiengang-Service: IDs aus Einschreibungen)
  rpc GetStudentsByStudiengang(StudiengangIdRequest) returns (StudentListResponse);
  
  // Holt Studenten anhand einer Liste von IDs (fuer gefilterte Abfrage)
  rpc GetStudentsByIds(StudentIdsRequest) returns (StudentListResponse);
}

// Request/Response Messages

message CredentialsRequest {
  string username = 1;
  string password = 2;  // Klartext-Passwort (wird serverseitig mit BCrypt verglichen)
}

message CredentialsResponse {
  bool valid = 1;
  int64 user_id = 2;
  repeated string roles = 3;
  int64 mandant_id = 4;
  string vorname = 5;
  string nachname = 6;
  int64 student_id = 7;  // 0 wenn kein Student
}

message UserIdRequest {
  int64 user_id = 1;
}

message UsernameRequest {
  string username = 1;
}

message UserResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string vorname = 4;
  string nachname = 5;
  repeated string roles = 6;
  int64 mandant_id = 7;
  bool active = 8;
}

message StudentIdRequest {
  int64 student_id = 1;
  int64 mandant_id = 2;  // Für DB-per-Tenant-Routing
}

message StudiengangIdRequest {
  int64 studiengang_id = 1;
  int64 mandant_id = 2;  // Für DB-per-Tenant-Routing
}

message StudentIdsRequest {
  repeated int64 student_ids = 1;
  int64 mandant_id = 2;  // Für DB-per-Tenant-Routing
}

message StudentResponse {
  int64 id = 1;
  int64 user_id = 2;
  string matrikelnummer = 3;
  string vorname = 4;
  string nachname = 5;
  string status = 6;
}

message StudentListResponse {
  repeated StudentResponse students = 1;
}

message StudentExistsResponse {
  bool exists = 1;
  int64 student_id = 2;
  string matrikelnummer = 3;
}
