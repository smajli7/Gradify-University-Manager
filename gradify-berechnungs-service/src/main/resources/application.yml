server:
  port: 8085

spring:
  application:
    name: gradify-berechnungs-service
  profiles:
    active: dev
  
  # Datenbank Konfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/gradify_berechnung
    username: gradify
    password: gradify123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # RabbitMQ (Message Queue)
  rabbitmq:
    host: localhost
    port: 5672
    username: gradify
    password: gradify123

# gRPC Server + Client
grpc:
  server:
    port: 9085
  client:
    noten-service:
      address: static://localhost:9084
      negotiationType: PLAINTEXT
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    studiengang-service:
      address: static://localhost:9083
      negotiationType: PLAINTEXT
      enableKeepAlive: true
      keepAliveWithoutCalls: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging
logging:
  level:
    de.gradify: DEBUG

gradify:
  tenant-routing:
    enabled: true
  tenant-registry:
    enabled: true
  tenants: "1:thm,2:gu"

---
# Profil für Produktion (Supabase)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
gradify:
  tenant-routing:
    enabled: false


