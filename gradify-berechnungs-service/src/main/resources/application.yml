server:
  port: 8085

spring:
  application:
    name: gradify-berechnungs-service
  
  # Datenbank Konfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/gradify_berechnung
    username: gradify
    password: gradify123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# gRPC Server + Client
grpc:
  server:
    port: 9085
  client:
    noten-service:
      address: static://localhost:9084
      negotiationType: PLAINTEXT
    studiengang-service:
      address: static://localhost:9083
      negotiationType: PLAINTEXT

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    de.gradify: DEBUG

---
# Profil für Produktion (Supabase)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}


