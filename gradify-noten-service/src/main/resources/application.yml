server:
  port: 8084

spring:
  application:
    name: gradify-noten-service
  profiles:
    active: dev
  
  # Datenbank Konfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/gradify_noten
    username: gradify
    password: gradify123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # GraphQL
  graphql:
    graphiql:
      enabled: true
    path: /graphql

  # RabbitMQ (Message Queue)
  rabbitmq:
    host: localhost
    port: 5672
    username: gradify
    password: gradify123

# gRPC Server + Client
grpc:
  server:
    port: 9084
  client:
    berechnungs-service:
      address: static://localhost:9085
      negotiationType: PLAINTEXT
      deadlineAfter: 10000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# JWT (gleicher Secret wie Auth-Service fuer Signatur-Verifikation)
jwt:
  secret: gradify-secret-key-change-in-production-min-256-bit

# Logging
logging:
  level:
    de.gradify: DEBUG

gradify:
  tenant-routing:
    enabled: true
  tenant-registry:
    enabled: true
  tenants: "1:thm,2:gu"

---
# Profil für Entwicklung (lokale Datenbank mit Seed-Daten)
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8

---
# Profil für Produktion (Supabase)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
gradify:
  tenant-routing:
    enabled: false


