<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" fill="none">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(200, 210, 220, 0.9)"/>
      <stop offset="30%" stop-color="rgba(180, 190, 200, 0.8)"/>
      <stop offset="50%" stop-color="rgba(160, 170, 180, 0.75)"/>
      <stop offset="70%" stop-color="rgba(180, 190, 200, 0.8)"/>
      <stop offset="100%" stop-color="rgba(200, 210, 220, 0.9)"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8D2DC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#C8D2DC"/>
    </linearGradient>
  </defs>
  <rect width="640" height="200" fill="#121212" rx="12"/>
  <g transform="translate(220, 32)">
