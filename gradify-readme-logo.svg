    <text x="72" y="30" text-anchor="middle" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600">1.0</text>
    <line x1="100" y1="18" x2="100" y2="42" stroke="#8B949E" stroke-width="1.5" opacity="0.8"/>
    <text x="128" y="30" text-anchor="middle" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600">1.3</text>
  </g>
  <text x="320" y="118" text-anchor="middle" fill="url(#titleGrad)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="500" letter-spacing="4">Gradify</text>
  <text x="320" y="155" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="450" letter-spacing="0.5">Notenmanagement-System f&#252;r Hochschulen</text>
