# Auth-Service: JWT-Authentifizierung, Login/Logout/Refresh
# gRPC Client -> User-Service (Credential-Validierung)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: gradify
  labels:
    app: gradify
    component: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gradify
      component: auth-service
  template:
    metadata:
      labels:
        app: gradify
        component: auth-service
    spec:
      containers:
      - name: auth-service
        image: gradify/auth-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SERVER_PORT
          value: "8081"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: gradify-config
              key: SPRING_DATASOURCE_URL_AUTH
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: GRPC_CLIENT_USER_SERVICE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: gradify-config
              key: GRPC_CLIENT_USER_SERVICE_ADDRESS
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: gradify
  labels:
    app: gradify
    component: auth-service
spec:
  type: ClusterIP
  selector:
    app: gradify
    component: auth-service
  ports:
  - port: 8081
    targetPort: 8081
    name: http
