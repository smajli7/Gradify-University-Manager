# Secrets fuer Gradify (Base64-encoded)
# In Produktion: externe Secret-Manager (Vault, AWS Secrets Manager, etc.)
# Encode: echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: gradify
type: Opaque
data:
  # gradify
  POSTGRES_USER: Z3JhZGlmeQ==
  # gradify123
  POSTGRES_PASSWORD: Z3JhZGlmeTEyMw==
  # gradify_auth
  POSTGRES_DB: Z3JhZGlmeV9hdXRo
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: gradify
type: Opaque
data:
  # gradify
  RABBITMQ_DEFAULT_USER: Z3JhZGlmeQ==
  # gradify123
  RABBITMQ_DEFAULT_PASS: Z3JhZGlmeTEyMw==
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: gradify
type: Opaque
data:
  # gradify-secret-key-change-in-production-min-256-bit
  JWT_SECRET: Z3JhZGlmeS1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLW1pbi0yNTYtYml0
