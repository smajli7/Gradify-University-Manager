# API-Gateway: Spring Cloud Gateway
# Routing aller REST/GraphQL-Requests an die Backend-Services
# Nutzt Profil "docker" fuer Service-DNS-Namen
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: gradify
  labels:
    app: gradify
    component: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gradify
      component: api-gateway
  template:
    metadata:
      labels:
        app: gradify
        component: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: gradify/api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_PROFILES_ACTIVE
          value: docker
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: gradify
  labels:
    app: gradify
    component: api-gateway
spec:
  type: ClusterIP
  selector:
    app: gradify
    component: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
    name: http
