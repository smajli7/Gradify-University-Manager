# RabbitMQ: Deployment + Service
# Message Queue fuer asynchrone Kommunikation (Noten <-> Berechnung)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: gradify
  labels:
    app: gradify
    component: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gradify
      component: rabbitmq
  template:
    metadata:
      labels:
        app: gradify
        component: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        envFrom:
        - secretRef:
            name: rabbitmq-credentials
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "ping"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: gradify
  labels:
    app: gradify
    component: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: gradify
    component: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
