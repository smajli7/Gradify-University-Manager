# Integration-Test Konfiguration fuer Auth-Service (Testcontainers Postgres)
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Konfiguration fuer Tests
jwt:
  secret: test-secret-key-for-integration-tests-only-1234567890
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# gRPC deaktiviert fuer Integration Tests (User-Service wird gemockt)
grpc:
  server:
    port: -1
  client:
    GLOBAL:
      negotiation-type: plaintext
